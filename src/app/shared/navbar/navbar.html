<header class="navbar">
  <div class="container navbar__inner">

    <!-- BRAND -->
    <a
      routerLink="/"
      class="brand"
      (click)="closeMenu()"
    >
      <span class="brand__mark">AM</span>

      <span class="brand__text">
        <span class="brand__name">Artur Marbach</span>
        <span class="brand__role">Linux · Cloud · DevOps</span>
      </span>
    </a>

    <!-- DESKTOP NAVIGATION -->
    <nav class="nav">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
      >
        Projects
      </a>

      <a
        routerLink="/notes"
        routerLinkActive="active"
      >
        Engineering Notes
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
      >
        About
      </a>

    </nav>

    <!-- ACTIONS -->
    <div class="navbar__actions">

      <a
        class="github"
        href="https://github.com/A-Marbach"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.4-1.3-5.4-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.8 5.5-5.4 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7"
          />
        </svg>

        <span>GitHub</span>
      </a>

      <a
        routerLink="/contact"
        class="contact-button"
      >
        Contact
        <span>→</span>
      </a>

      <!-- MOBILE MENU -->
      <button
        class="menu-button"
        type="button"
        aria-label="Toggle navigation"
        [class.active]="menuOpen"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </div>

  <!-- MOBILE NAV -->
  <nav
    class="mobile-nav"
    [class.mobile-nav--open]="menuOpen"
  >

    <div class="container mobile-nav__inner">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <span>01</span>
        Home
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span>02</span>
        Projects
      </a>

      <a
        routerLink="/notes"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span>03</span>
        Engineering Notes
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span>04</span>
        About
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span>05</span>
        Contact
      </a>

    </div>

  </nav>
</header>
